name: ci pipeline java code
on:
   push:
    branches: master
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: action/checkout@v5
      - name: set-up jdk
        uses: action/setup-java@v5
        with:
          distribution: 'temrin'
          java-version: '17'
      - name: validate with maven
        run:  mvn validate
      - name: compile with maven
        run:  mvn compile
      - name: test with maven
        run:  mvn test
      - name: package with maven
        run:  mvn package
      - name: verify war file
        run:  ls -lh target/



        
